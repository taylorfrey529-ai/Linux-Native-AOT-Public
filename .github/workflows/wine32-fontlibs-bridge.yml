name: Wine32 Fontlibs Bridge

on:
  push:
    branches:
      - chatgpt-wow-client-transfer-20260928
    paths:
      - '.github/workflows/wine32-fontlibs-bridge.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Build i386 font runtime supplement
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libfreetype6:i386 libfontconfig1:i386
          mkdir -p rootfs
          : > paths.txt
          for f in /usr/lib/i386-linux-gnu/libfreetype.so.6 /usr/lib/i386-linux-gnu/libfontconfig.so.1; do
            test -e "$f"
            echo "$f" >> paths.txt
            ldd "$f" | awk '/=> \/.* \(0x/ {print $3} /^\// {print $1}' >> paths.txt
          done
          sort -u paths.txt -o paths.txt
          while IFS= read -r f; do
            test -e "$f"
            d="rootfs$f"
            mkdir -p "$(dirname "$d")"
            cp -L "$f" "$d"
          done < paths.txt
          tar -cJf wine32-fontlibs.tar.xz -C rootfs .
          sha256sum wine32-fontlibs.tar.xz > SHA256SUMS
          du -sh rootfs
          stat -c 'archive_bytes=%s' wine32-fontlibs.tar.xz
      - name: Upload font runtime
        uses: actions/upload-artifact@v4
        with:
          name: wine32-fontlibs
          path: |
            wine32-fontlibs.tar.xz
            SHA256SUMS
            paths.txt
          compression-level: 0
          retention-days: 1
