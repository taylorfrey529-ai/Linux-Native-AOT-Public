name: WoW Client Mirror Resolve

on:
  push:
    branches:
      - chatgpt-wow-client-transfer-20260928

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ChromieCraft mirror hosts
        shell: bash
        run: |
          set -euo pipefail
          for h in chmi.btground.dedyn.io usefulness.altervista.org btground.dedyn.io; do
            echo "HOST=$h"
            getent ahostsv4 "$h" | awk '{print $1}' | sort -u
          done
