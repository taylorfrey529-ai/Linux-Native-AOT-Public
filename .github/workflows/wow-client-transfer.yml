name: WoW Client Verified Transfer

on:
  push:
    branches:
      - chatgpt-wow-client-transfer-20260928
    paths:
      - '.github/workflows/wow-client-transfer.yml'

permissions:
  contents: read
  actions: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Prepare runner
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2
          df -h /
      - name: Download and verify official ChromieCraft source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source transfer
          curl -L --fail --silent --show-error --retry 5 --retry-delay 3 \
            -A 'Mozilla/5.0' -e 'https://chromiecraft.com/en/downloads/' \
            -o client.torrent 'https://usefulness.altervista.org/WoW/ChromieCraft_3.3.5a.zip.torrent'
          test "$(sha256sum client.torrent | awk '{print $1}')" = '58731d43da3e615fbeb489ebd7a9401a8b56eeed8b7baf72f6b57646c574f62e'
          aria2c --dir=source --seed-time=0 --file-allocation=none --allow-overwrite=true \
            --auto-file-renaming=false --check-integrity=true --bt-enable-lpd=false \
            --enable-dht=true --enable-dht6=false --bt-stop-timeout=600 --summary-interval=60 \
            client.torrent
          test -f source/ChromieCraft_3.3.5a.zip
          test "$(stat -c %s source/ChromieCraft_3.3.5a.zip)" = '17674749792'
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          src=Path('source/ChromieCraft_3.3.5a.zip')
          chunk=240*1024*1024
          whole=hashlib.sha256()
          parts=[]
          offset=0
          with src.open('rb') as f:
              i=0
              while True:
                  data=f.read(chunk)
                  if not data: break
                  whole.update(data)
                  parts.append({'index':i,'name':f'payload.part.{i:03d}','offset':offset,'size':len(data),'sha256':hashlib.sha256(data).hexdigest()})
                  offset += len(data); i += 1
          manifest={
            'logical_name':'ChromieCraft_3.3.5a.zip',
            'source_page':'https://chromiecraft.com/en/downloads/',
            'torrent_url':'https://usefulness.altervista.org/WoW/ChromieCraft_3.3.5a.zip.torrent',
            'torrent_sha256':'58731d43da3e615fbeb489ebd7a9401a8b56eeed8b7baf72f6b57646c574f62e',
            'torrent_info_hash_sha1':'2ba2833baf733ce0a16040d43ed09491f2bf2ab2',
            'size':src.stat().st_size,
            'sha256':whole.hexdigest(),
            'chunk_size':chunk,
            'parts':parts
          }
          assert len(parts)==71 and offset==17674749792
          Path('manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('SOURCE_SHA256='+manifest['sha256'])
          print('PARTS='+str(len(parts)))
          PY
          df -h /
      - name: Prepare part 065
        shell: bash
        run: |
          set -euo pipefail
          python3 - 65 <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          idx=int(sys.argv[1])
          m=json.loads(Path('manifest.json').read_text())
          part=m['parts'][idx]
          src=Path('source/ChromieCraft_3.3.5a.zip')
          out=Path('transfer')/part['name']
          with src.open('rb') as f:
              f.seek(part['offset']); data=f.read(part['size'])
          assert len(data)==part['size']
          assert hashlib.sha256(data).hexdigest()==part['sha256']
          out.write_bytes(data)
          print(out, len(data), part['sha256'])
          PY
      - name: Upload part 065
        id: upload_065
        uses: actions/upload-artifact@v4
        with:
          name: wow-client-part-065
          path: |
            transfer/payload.part.065
            manifest.json
          compression-level: 0
          retention-days: 1
      - name: Await VM verification 065
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload_065.outputs.artifact-id }}
        run: |
          set -euo pipefail
          ACK='.transfer-acks/065'
          for attempt in $(seq 1 180); do
            if gh api "repos/$GITHUB_REPOSITORY/contents/$ACK?ref=chatgpt-wow-client-transfer-20260928" >/dev/null 2>&1; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
              rm -f transfer/payload.part.065
              echo "VM acknowledged part 065; artifact deleted."
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for VM acknowledgment of part 065" >&2
          exit 1
