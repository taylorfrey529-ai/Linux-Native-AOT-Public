name: WoW Client Current Runtime Recovery

on:
  push:
    branches:
      - chatgpt-wow-client-transfer-20260928
    paths:
      - '.github/workflows/wow-client-current-recovery.yml'

permissions:
  contents: read
  actions: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Prepare runner
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2
          df -h /
      - name: Download and verify ChromieCraft source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source transfer
          curl -L --fail --silent --show-error --retry 5 --retry-delay 3 \
            -A 'Mozilla/5.0' -e 'https://chromiecraft.com/en/downloads/' \
            -o client.torrent 'https://usefulness.altervista.org/WoW/ChromieCraft_3.3.5a.zip.torrent'
          test "$(sha256sum client.torrent | awk '{print $1}')" = '58731d43da3e615fbeb489ebd7a9401a8b56eeed8b7baf72f6b57646c574f62e'
          aria2c --dir=source --seed-time=0 --file-allocation=none --allow-overwrite=true \
            --auto-file-renaming=false --check-integrity=true --bt-enable-lpd=false \
            --enable-dht=true --enable-dht6=false --bt-stop-timeout=600 --summary-interval=60 \
            client.torrent
          test -f source/ChromieCraft_3.3.5a.zip
          test "$(stat -c %s source/ChromieCraft_3.3.5a.zip)" = '17674749792'
          test "$(sha256sum source/ChromieCraft_3.3.5a.zip | awk '{print $1}')" = 'fed612104085999e8875f077a5ed1e055aac7faaab413a33fed6a23bc2339732'
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          src=Path('source/ChromieCraft_3.3.5a.zip')
          chunk=240*1024*1024
          parts=[]; offset=0
          with src.open('rb') as f:
              i=0
              while True:
                  data=f.read(chunk)
                  if not data: break
                  parts.append({'index':i,'name':f'payload.part.{i:03d}','offset':offset,'size':len(data),'sha256':hashlib.sha256(data).hexdigest()})
                  offset += len(data); i += 1
          m={'logical_name':src.name,'size':src.stat().st_size,'sha256':'fed612104085999e8875f077a5ed1e055aac7faaab413a33fed6a23bc2339732','chunk_size':chunk,'parts':parts}
          assert len(parts)==71 and offset==17674749792
          Path('manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          PY
      - name: Prepare part 000
        shell: bash
        run: |
          set -euo pipefail
          python3 - 0 <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          idx=int(sys.argv[1]); m=json.loads(Path('manifest.json').read_text()); part=m['parts'][idx]
          src=Path('source/ChromieCraft_3.3.5a.zip'); out=Path('transfer')/part['name']
          with src.open('rb') as f:
              f.seek(part['offset']); data=f.read(part['size'])
          assert len(data)==part['size'] and hashlib.sha256(data).hexdigest()==part['sha256']
          out.write_bytes(data)
          PY
      - name: Upload part 000
        id: upload_000
        uses: actions/upload-artifact@v4
        with:
          name: wow-client-current-part-000
          path: |
            transfer/payload.part.000
            manifest.json
          compression-level: 0
          retention-days: 1
      - name: Await current VM verification 000
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload_000.outputs.artifact-id }}
        run: |
          set -euo pipefail
          ACK='.transfer-acks-current-20260929/000'
          for attempt in $(seq 1 240); do
            if gh api "repos/$GITHUB_REPOSITORY/contents/$ACK?ref=chatgpt-wow-client-transfer-20260928" >/dev/null 2>&1; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" || true
              rm -f transfer/payload.part.000
              echo "Current VM acknowledged part 000."
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for current VM acknowledgment of part 000" >&2
          exit 1
      - name: Prepare part 001
        shell: bash
        run: |
          set -euo pipefail
          python3 - 1 <<'PY'
