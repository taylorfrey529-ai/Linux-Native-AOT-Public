name: AzerothCore Ubuntu runtime bridge

on:
  push:
    branches:
      - chatgpt-wow-transfer-20260928

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install matching runtime packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libmysqlclient-dev mysql-client-core-8.0 \
            libboost-atomic1.83.0 libboost-regex1.83.0
          echo "mysql_config=$(mysql_config --version)"
          mysql --version
          dpkg-query -W -f='${Package} ${Version}\n' \
            libmysqlclient-dev mysql-client-core-8.0 \
            libboost-atomic1.83.0 libboost-regex1.83.0

      - name: Stage runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/lib runtime/bin
          MYSQL_LIB="$(ldconfig -p | awk '/libmysqlclient\.so\.21/{print $NF; exit}')"
          test -n "$MYSQL_LIB"
          cp -L "$MYSQL_LIB" runtime/lib/libmysqlclient.so.21
          cp -L "$(ldconfig -p | awk '/libboost_atomic\.so\.1\.83\.0/{print $NF; exit}')" runtime/lib/libboost_atomic.so.1.83.0
          cp -L "$(ldconfig -p | awk '/libboost_regex\.so\.1\.83\.0/{print $NF; exit}')" runtime/lib/libboost_regex.so.1.83.0
          cp -L "$(command -v mysql)" runtime/bin/mysql
          sha256sum runtime/lib/* runtime/bin/*
          ldd runtime/lib/libmysqlclient.so.21

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: azerothcore-ubuntu24-runtime
          path: runtime
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
